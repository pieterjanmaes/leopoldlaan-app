# docs/ is its own pnpm project (own lockfile), so it needs its own build-script
# allow list — the root pnpm-workspace.yaml does not apply here.
allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  vue-demi: true
  workerd: true

# Same as the root: Nuxt releases are adopted immediately.
minimumReleaseAgeExclude:
  - nuxt
  - '@nuxt/*'
